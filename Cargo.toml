[package]
name = "lsp-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
async-lsp = { version = "0.2.4", default-features = false, features = ["omni-trait"] }
rmcp = { version = "3.12.0", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt", "process", "io-util", "fs", "sync", "time", "signal"] }
tokio-util = { version = "0.7.20", features = ["compat"] }

[dev-dependencies]
rmcp = { version = "3.12.0", default-features = false, features = ["client", "transport-child-process"] }
tempfile = "3.27.0"
